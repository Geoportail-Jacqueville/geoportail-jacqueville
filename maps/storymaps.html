<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Histoire & Patrimoine de Jacqueville — Géoportail Territorial de Jacqueville</title>
    <link rel="icon" type="image/jpeg" sizes="32x32" href="https://github.com/Geoportail-Jacqueville/geoportail-jacqueville/blob/main/logo/logo-favicon.jpeg?raw=true">
    <link rel="apple-touch-icon" href="https://github.com/Geoportail-Jacqueville/geoportail-jacqueville/blob/main/logo/logo-favicon.jpeg?raw=true">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
        }

        body {
            padding-top: 64px; /* hauteur de la navbar */
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            /* Aucun padding pour que l'iframe touche les bords */
            padding: 0;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            /* Pleine largeur, pas de coins arrondis */
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            background: #e9edf2;
            position: relative;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        #footer-placeholder {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 56px; /* ajustement mobile */
            }
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main>
        <div class="iframe-container">
            <iframe
                src="https://storymaps.arcgis.com/stories/c6bccab68f044bb2b01c3fe08fbd4017"
                allowfullscreen
                loading="lazy"
                title="Histoire & Patrimoine de Jacqueville">
            </iframe>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPT PRINCIPAL -->
    <script src="/js/main.js"></script>
</body>
</html>
