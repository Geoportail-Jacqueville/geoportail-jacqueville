<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Cartothèque complète — Géoportail Territorial de Jacqueville</title>
    <link rel="icon" type="image/jpeg" sizes="32x32" href="https://github.com/Geoportail-Jacqueville/geoportail-jacqueville/blob/main/logo/logo-favicon.jpeg?raw=true">
    <link rel="apple-touch-icon" href="https://github.com/Geoportail-Jacqueville/geoportail-jacqueville/blob/main/logo/logo-favicon.jpeg?raw=true">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ===== CORRECTIONS POUR MOBILE ===== */
        html, body {
            overflow-x: hidden;
        }

        body {
            padding-top: 64px;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            color: #1A2C3E;
            line-height: 1.5;
        }

        /* Styles de la modale */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease, visibility 0.15s ease;
            padding: 20px;
            will-change: opacity;
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            position: relative;
            max-width: 95vw;
            max-height: 90vh;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            animation: modalIn 0.15s ease-out;
            will-change: transform;
            transform: translateZ(0);
        }
        @keyframes modalIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: #1A2C3E;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #64748B;
            line-height: 1;
            padding: 0 4px;
            transition: color 0.2s;
            border-radius: 4px;
        }
        .modal-close:hover {
            color: #1A2C3E;
            background: #e2e8f0;
        }
        .modal-image-wrapper {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            padding: 20px;
            min-height: 300px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-x pan-y;
        }
        .modal-image-wrapper img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 4px;
            display: block;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .modal-image-wrapper img.loaded {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .modal-overlay {
                padding: 10px;
                align-items: flex-start;
                overflow-y: auto;
            }
            .modal-content {
                max-width: 100%;
                width: 100%;
                margin: 0 auto;
                border-radius: 12px;
            }
            .modal-image-wrapper {
                padding: 10px;
            }
            .modal-image-wrapper img {
                max-height: 70vh;
            }
        }

        /* Conteneur principal */
        .cartotheque-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* En-tête */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .page-header .emoji {
            font-size: 48px;
        }
        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1A2C3E;
            margin: 0;
        }
        .page-header h1 span {
            color: #70C7FD;
        }
        .page-header p {
            color: #4A627A;
            margin-top: 12px;
        }
        .page-header .divider {
            width: 60px;
            height: 3px;
            background: #70C7FD;
            margin: 20px auto 0;
        }

        /* Barre de filtres */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        .filter-btn {
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            background: transparent;
            border: 1px solid rgba(112, 199, 253, 0.3);
            color: #4A627A;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
        }
        .filter-btn:hover {
            border-color: #70C7FD;
            color: #70C7FD;
            background: rgba(112, 199, 253, 0.05);
        }
        .filter-btn.active {
            background: #70C7FD;
            color: #1A2C3E;
            border-color: #70C7FD;
            font-weight: 600;
        }

        /* Grille des cartes */
        .cartes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .carte-card {
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            background: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out, border-color 0.15s ease-out;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .carte-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            border-color: #70C7FD;
        }
        .carte-card:active {
            transform: scale(0.98);
        }
        .carte-card.hidden {
            display: none;
        }
        .carte-image {
            height: 180px;
            background-size: cover;
            background-position: center;
            position: relative;
            flex-shrink: 0;
            background-color: #e2e8f0;
        }
        .carte-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            z-index: 0;
        }
        .carte-image[style*="background-image"]::before {
            display: none;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .carte-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            z-index: 1;
        }
        .carte-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .carte-body h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            font-weight: 600;
            color: #1A2C3E;
        }
        .carte-body p {
            color: #64748B;
            font-size: 13px;
            line-height: 1.5;
            margin: 0 0 16px 0;
            flex: 1;
        }
        .carte-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #94A3B8;
        }
        .carte-footer .voir {
            color: #70C7FD;
            font-weight: 500;
        }

        /* Bouton retour */
        .back-link {
            text-align: center;
            margin-top: 48px;
        }
        .back-link a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: #70C7FD;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            border: 1px solid #70C7FD;
            transition: all 0.3s ease;
        }
        .back-link a:hover {
            background: #70C7FD;
            color: #1A2C3E;
        }

        @media (max-width: 600px) {
            .cartes-grid {
                grid-template-columns: 1fr;
            }
            .filter-btn {
                padding: 6px 14px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="cartotheque-page">
        <div class="page-header">
            <h1>Cartothèques <span>complètes</span></h1>
            <p>Découvrez l'intégralité des cartes thématiques disponibles sur le géoportail de Jacqueville.</p>
            <div class="divider"></div>
        </div>

        <!-- Barre de filtres par thème -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-filter="all">Toutes</button>
            <button class="filter-btn" data-filter="environnement">Environnement</button>
            <button class="filter-btn" data-filter="risques">Risques</button>
            <button class="filter-btn" data-filter="infrastructures">Infrastructures</button>
            <button class="filter-btn" data-filter="hydrographie">Hydrographie</button>
            <button class="filter-btn" data-filter="urbanisme">Urbanisme</button>
            <button class="filter-btn" data-filter="agriculture">Agriculture</button>
        </div>

        <div class="cartes-grid" id="cartesGrid">
            <!-- Généré par JavaScript -->
        </div>

        <div class="back-link">
            <a href="index.html">← Retour à la cartothèque principale</a>
        </div>
    </main>

    <!-- Modale -->
    <div class="modal-overlay" id="mapModal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h3 id="modalTitle">Carte</h3>
                <button class="modal-close" id="modalClose" aria-label="Fermer">&times;</button>
            </div>
            <div class="modal-image-wrapper">
                <img src="" alt="" id="modalImage" loading="lazy">
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        (function() {
            // Tableau des cartes avec thème spécifique pour le filtrage
            const cartes = [
                { titre: 'Zones humides', description: 'Cartographie des zones humides d\'intérêt écologique et hydrologique.', badge: '🌿 ENVIRONNEMENT', theme: 'environnement', image: '/cartes/Cartes%20des%20zones%20humides.png', date: '2026' },
                { titre: 'Risque d\'inondation', description: 'Cartographie des zones inondables selon les hauteurs d\'eau simulées (0 à 5 m).', badge: '🌊 RISQUES', theme: 'risques', image: 'https://placehold.co/600x300/70C7FD/white?text=Risque+inondation', date: '2024' },
                { titre: 'Submersion marine', description: 'Analyse de la vulnérabilité du littoral face à la montée des eaux et aux tempêtes.', badge: '🌊 RISQUES', theme: 'risques', image: 'https://placehold.co/600x300/70C7FD/white?text=Submersion+marine', date: '2024' },
                { titre: 'Contributions au stock total de CO₂', description: 'Cartographie des zones contribuant le plus au stockage et à la séquestration du CO₂.', badge: '🌿 ENVIRONNEMENT', theme: 'environnement', image: '/cartes/Carte%20des%20contributions%20au%20stock%20CO%E2%82%82.png', date: '2026' },
                { titre: 'Indice NDVI', description: 'Cartographie de l\'Indice de Végétation par Différence Normalisée (NDVI).', badge: '🌿 ENVIRONNEMENT', theme: 'environnement', image: '/cartes/NDVI%20Jacqueville.png', date: '2025' },
                { titre: 'Indice NDRE', description: 'Cartographie de l\'Indice de Végétation par Réflexion dans le Proche Infrarouge.', badge: '🌿 ENVIRONNEMENT', theme: 'environnement', image: '/cartes/NDRE%20Jacqueville.png', date: '2025' },
                { titre: 'Infrastructures et équipements', description: 'Localisation des écoles, centres de santé, marchés, mairies et équipements publics.', badge: '🏗️ INFRASTRUCTURES', theme: 'infrastructures', image: 'https://placehold.co/600x300/70C7FD/white?text=Infrastructures', date: '2024' },
                { titre: 'Réseau hydrographique', description: 'Cartographie des cours d\'eau, lagunes, zones humides et forêts marécageuses.', badge: '💧 HYDROGRAPHIE', theme: 'hydrographie', image: 'https://placehold.co/600x300/4BB3F0/white?text=Réseau+hydrographique', date: '2024' },
                { titre: 'Zones constructibles', description: 'Identification des zones favorables à l\'urbanisation, hors contraintes environnementales.', badge: '🏙️ URBANISME', theme: 'urbanisme', image: 'https://placehold.co/600x300/70C7FD/white?text=Zones+constructibles', date: '2024' },
                { titre: 'Zones agricoles favorables', description: 'Cartographie des zones propices à l\'agriculture selon la qualité des sols et l\'accès à l\'eau.', badge: '🌾 AGRICULTURE', theme: 'agriculture', image: 'https://placehold.co/600x300/70C7FD/white?text=Zones+agricoles', date: '2024' },
                { titre: 'Risque hydrologique', description: 'Cartographie des contraintes liées aux nappes phréatiques et à la saturation des sols.', badge: '💧 RISQUES', theme: 'risques', image: 'https://placehold.co/600x300/70C7FD/white?text=Risque+hydrologique', date: '2024' },
                { titre: 'Zone tampon riveraine', description: 'Identification des zones tampon (0-108 m) autour des cours d\'eau et espaces protégés.', badge: '🌿 ENVIRONNEMENT', theme: 'environnement', image: 'https://placehold.co/600x300/4BB3F0/white?text=Zone+tampon', date: '2024' }
            ];

            const grid = document.getElementById('cartesGrid');
            const modal = document.getElementById('mapModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalClose = document.getElementById('modalClose');
            const filterButtons = document.querySelectorAll('.filter-btn');

            const imageCache = new Map();

            function preloadImage(url) {
                if (imageCache.has(url)) return Promise.resolve(imageCache.get(url));
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => { imageCache.set(url, img); resolve(img); };
                    img.onerror = () => resolve(null);
                    img.src = url;
                });
            }

            function renderCards(filter = 'all') {
                grid.innerHTML = ''; // On vide la grille
                const fragment = document.createDocumentFragment();

                cartes.forEach((carte) => {
                    if (filter !== 'all' && carte.theme !== filter) return;

                    const card = document.createElement('div');
                    card.className = 'carte-card';
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('aria-label', 'Agrandir : ' + carte.titre);
                    card.dataset.theme = carte.theme; // Stocke le thème pour plus tard

                    card.innerHTML = `
                        <div class="carte-image" data-src="${carte.image}">
                            <span class="carte-badge">${carte.badge}</span>
                        </div>
                        <div class="carte-body">
                            <h3>${carte.titre}</h3>
                            <p>${carte.description}</p>
                            <div class="carte-footer">
                                <span>Mise à jour : ${carte.date}</span>
                                <span class="voir">Voir la carte →</span>
                            </div>
                        </div>
                    `;

                    const imageDiv = card.querySelector('.carte-image');
                    imageDiv.style.backgroundColor = '#e2e8f0';

                    const tempImg = new Image();
                    tempImg.onload = function() {
                        imageDiv.style.backgroundImage = `url('${carte.image}')`;
                        imageDiv.style.backgroundColor = 'transparent';
                    };
                    tempImg.onerror = function() {
                        console.warn('Image non chargée :', carte.image);
                    };
                    tempImg.src = carte.image;

                    card.addEventListener('click', () => {
                        preloadImage(carte.image).then(() => {
                            modalImage.src = carte.image;
                            modalImage.alt = carte.titre;
                            modalTitle.textContent = carte.titre;
                            modal.offsetHeight;
                            modal.classList.add('active');
                            modal.setAttribute('aria-hidden', 'false');
                            document.body.style.overflow = 'hidden';
                            modalImage.classList.remove('loaded');
                            requestAnimationFrame(() => {
                                modalImage.classList.add('loaded');
                            });
                            modalClose.focus();
                        });
                    });

                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            card.click();
                        }
                    });

                    fragment.appendChild(card);
                });

                grid.appendChild(fragment);
            }

            // Gestion du filtre
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const filter = this.dataset.filter;
                    renderCards(filter);
                });
            });

            // Rendu initial
            renderCards('all');

            // Préchargement en arrière-plan (optionnel)
            if ('requestIdleCallback' in window) {
                requestIdleCallback(() => {
                    cartes.forEach(carte => preloadImage(carte.image));
                });
            } else {
                setTimeout(() => {
                    cartes.forEach(carte => preloadImage(carte.image));
                }, 1000);
            }

            // Fermeture de la modale
            function closeModal() {
                modal.classList.remove('active');
                modal.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
                setTimeout(() => {
                    if (!modal.classList.contains('active')) {
                        modalImage.src = '';
                        modalImage.classList.remove('loaded');
                    }
                }, 200);
            }

            modalClose.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    closeModal();
                }
            });
        })();
    </script>

    <script src="js/main.js"></script>
</body>
</html>
