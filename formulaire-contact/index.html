<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nous contacter - Géoportail de Jacqueville</title>

  <!-- FAVICON AJOUTÉ -->
  <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/Geoportail-Jacqueville/open-data/main/Logo/logo-favicon.jpeg">
  <link rel="shortcut icon" type="image/jpeg" href="https://raw.githubusercontent.com/Geoportail-Jacqueville/open-data/main/Logo/logo-favicon.jpeg">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Mono:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #FFFFFF;
      overflow-x: hidden;
      padding: 40px 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #70C7FD;
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 32px;
      transition: gap 0.2s;
    }

    .back-link:hover {
      gap: 12px;
      text-decoration: underline;
    }

    .form-card {
      background: #FFFFFF;
      border-radius: 28px;
      border: 1px solid rgba(112, 199, 253, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .form-header {
      background: linear-gradient(135deg, #70C7FD, #4BB3F0);
      padding: 28px 32px;
      text-align: center;
    }

    .form-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1A2C3E;
      margin-bottom: 8px;
    }

    .form-header p {
      color: #1A2C3E;
      opacity: 0.85;
      font-size: 14px;
    }

    .form-body {
      padding: 32px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1A2C3E;
      margin-bottom: 8px;
    }

    .form-group label .required {
      color: #e74c3c;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #70C7FD;
      box-shadow: 0 0 0 3px rgba(112, 199, 253, 0.1);
    }

    .form-submit {
      width: 100%;
      background: linear-gradient(135deg, #70C7FD, #4BB3F0);
      color: #1A2C3E;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .form-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(112, 199, 253, 0.3);
    }

    .form-note {
      font-size: 11px;
      color: #64748B;
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #E2E8F0;
    }

    .success-message, .error-message {
      text-align: center;
      padding: 32px 24px;
      border-radius: 20px;
    }

    .success-message {
      background: #E8F5E9;
      color: #2E7D32;
    }

    .error-message {
      background: #FEE2E2;
      color: #991B1B;
    }

    .btn-secondary {
      background: #F1F5F9;
      color: #1A2C3E;
      margin-top: 16px;
      width: auto;
      padding: 12px 28px;
      display: inline-block;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      body { padding: 20px 16px; }
      .form-header { padding: 20px; }
      .form-body { padding: 24px 20px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="form-card">
    <div class="form-header">
      <h1>📝 Nous contacter</h1>
      <p>Une question, une suggestion, une collaboration ? Écrivez-nous !</p>
    </div>
    <div class="form-body" id="formBody">
      <form id="contactForm">
        <div class="form-group">
          <label>Nom complet <span class="required">*</span></label>
          <input type="text" name="nom" required placeholder="Votre nom et prénom">
        </div>

        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" name="email" required placeholder="votre@email.ci">
        </div>

        <div class="form-group">
          <label>Téléphone</label>
          <input type="tel" name="telephone" placeholder="Optionnel">
        </div>

        <div class="form-group">
          <label>Vous êtes <span class="required">*</span></label>
          <select name="profil" required>
            <option value="">Sélectionnez...</option>
            <option value="elu">Élu / Service technique municipal</option>
            <option value="chercheur">Chercheur / Étudiant</option>
            <option value="investisseur">Investisseur / Opérateur économique</option>
            <option value="ong">ONG / Association</option>
            <option value="citoyen">Citoyen / Habitant</option>
            <option value="autre">Autre</option>
          </select>
        </div>

        <div class="form-group">
          <label>Objet du message <span class="required">*</span></label>
          <select name="objet" required>
            <option value="">Sélectionnez...</option>
            <option value="donnees">Demande d'accès aux données</option>
            <option value="partenariat">Proposition de partenariat</option>
            <option value="information">Demande d'information générale</option>
            <option value="signalement">Signalement terrain</option>
            <option value="collaboration">Collaboration scientifique</option>
            <option value="autre">Autre</option>
          </select>
        </div>

        <div class="form-group">
          <label>Message <span class="required">*</span></label>
          <textarea name="message" rows="5" required placeholder="Décrivez votre demande ou votre message..."></textarea>
        </div>

        <div class="form-group">
          <label style="display: flex; align-items: flex-start; gap: 12px; font-weight: normal; cursor: pointer;">
            <input type="checkbox" name="consentement" required style="width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0;">
            <span style="font-size: 13px; line-height: 1.5; color: #1A2C3E;">
              J'ai lu et j'accepte la <a href="https://geoportail-jacqueville-ird.opendata.arcgis.com/pages/confidentialite" target="_blank" style="color: #70C7FD;">politique de confidentialité</a>.
            </span>
          </label>
        </div>

        <button type="submit" class="form-submit">📨 Envoyer le message</button>
        <p class="form-note">
          🔒 Vos informations sont confidentielles. Un conseiller vous répondra sous 48h ouvrées.
        </p>
      </form>
    </div>
  </div>
</div>

<script>
  const formElement = document.getElementById('contactForm');
  const formBody = document.getElementById('formBody');

  if (formElement) {
    formElement.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(formElement);
      formData.append('_subject', '[Formulaire Contact] Nouveau message - Observatoire Jacqueville');
      formData.append('_replyto', formData.get('email'));
      formData.append('_form_type', 'contact');
      formData.append('date', new Date().toISOString());
      
      try {
        // ID Formspree pour le formulaire de contact
        const response = await fetch('https://formspree.io/f/xzdqzqgg', {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });
        
        if (response.ok) {
          formBody.innerHTML = `
            <div class="success-message">
              <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
              <h3 style="margin-bottom: 8px;">Message envoyé avec succès !</h3>
              <p>Nous avons bien reçu votre message. Nous vous répondrons sous 48h à l'adresse <strong>goueujean@gmail.com</strong>.</p>
              <a href="https://geoportail-jacqueville-ird.opendata.arcgis.com/pages/contact" 
                 class="btn-secondary" style="display: inline-block; margin-top: 20px;">
                ← Retour à la page contact
              </a>
            </div>
          `;
        } else {
          throw new Error('Erreur serveur');
        }
      } catch (error) {
        console.error('Erreur:', error);
        formBody.innerHTML = `
          <div class="error-message">
            <div style="font-size: 48px; margin-bottom: 12px;">❌</div>
            <h3 style="margin-bottom: 8px;">Erreur lors de l'envoi</h3>
            <p>Une erreur technique s'est produite. Veuillez réessayer ou nous contacter directement sur <strong>goueujean@gmail.com</strong>.</p>
            <button onclick="location.reload()" class="btn-secondary" style="background: #1A2C3E; color: white; margin-top: 20px;">
              🔄 Réessayer
            </button>
          </div>
        `;
      }
    });
  }
</script>
</body>
</html>
